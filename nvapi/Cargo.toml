[package]
name = "nvapi"
version = "0.0.0"
authors = ["Andrzej Janik <vosen@vosen.pl>"]
edition = "2021"

[lib]
name = "nvapi64"
crate-type = ["cdylib"]

[dependencies]
libloading = "0.8"
unwrap_or = "1.0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[package.metadata.zluda]
windows_only = true
windows32_paths = ["nvapi.dll"]
32bit = true
