[package]
name = "zluda_rand_agx"
version = "0.0.0"
edition = "2021"
description = "cuRAND on Apple GPUs (Asahi Linux) for zluda_agx, on agx_libs' MLIR kernels"

[lib]
name = "curand_agx"
crate-type = ["cdylib", "rlib"]

[dependencies]
agx_libs = { path = "../agx_libs" }
cuda_types = { path = "../cuda_types", default-features = false }

[package.metadata.zluda]
agx = true
linux_only = true
linux_symlinks = ["libcurand.so", "libcurand.so.10"]
